spring.application.name=lab4-spring-jpa-hsqldb

# Existing HSQLDB server: trainingdb on localhost:9001
spring.datasource.url=jdbc:hsqldb:hsql://localhost:9001/trainingdb
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=SA
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.HSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console application - no web server needed
spring.main.web-application-type=none